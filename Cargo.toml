[workspace]
resolver = "2"
members = [
  "crates/minedock-core",
  "crates/minedock-app",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
atomic-write-file = "0.3.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "2.12"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# GPUI is pre-1.0. The official 0.2.x registry release embeds its platform
# backends, so the app uses gpui::Application directly. Keep this pin explicit
# and retain Cargo.lock for reproducible Windows builds.
gpui = "=0.2.2"
